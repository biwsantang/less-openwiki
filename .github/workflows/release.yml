name: Plugin Release Readiness

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify plugin distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Enable package manager
        run: corepack enable

      - name: Install locked toolchain
        run: pnpm install --frozen-lockfile

      - name: Validate plugin package
        run: |
          pnpm plugin:validate
          pnpm format:check

      - name: Publish release summary
        run: |
          {
            echo "## Less OpenWiki plugin verified"
            echo
            echo "Codex and Claude Code manifests, shared skill, and Markdown wiki checks passed."
          } >> "$GITHUB_STEP_SUMMARY"
