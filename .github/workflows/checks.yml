name: Native Plugin Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: Validate native plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Enable package manager
        run: corepack enable

      - name: Validate manifests, skill, hooks, and documentation
        run: pnpm plugin:validate

      - name: Exercise native lifecycle
        run: pnpm plugin:test

      - name: Check plugin script syntax
        run: |
          node --check scripts/validate-native-plugin.mjs
          node --check plugins/less-openwiki/scripts/validate-wiki.mjs
          node --check plugins/less-openwiki/scripts/upstream-docs-report.mjs
          node --check plugins/less-openwiki/hooks/less-openwiki-hook.mjs
          node --check plugins/less-openwiki/runtime/storage.mjs
          node --check plugins/less-openwiki/runtime/lifecycle.mjs
          node --check plugins/less-openwiki/runtime/claims.mjs
          node --check plugins/less-openwiki/runtime/okf.mjs
