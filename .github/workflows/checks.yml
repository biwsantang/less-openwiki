name: Skill Plugin Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: Validate skill plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Enable package manager
        run: corepack enable

      - name: Install locked toolchain
        run: pnpm install --frozen-lockfile

      - name: Validate manifests, skill, and documentation
        run: pnpm plugin:validate

      - name: Check repository formatting
        run: pnpm format:check

      - name: Check plugin script syntax
        run: |
          node --check scripts/validate-native-plugin.mjs
          node --check scripts/validate-wiki.mjs
          node --check scripts/upstream-docs-report.mjs
